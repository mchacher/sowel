<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Palette (spec 196, 4b): ocean bar in light, the night page in dark. -->
    <meta name="theme-color" content="#1A4F6E" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E191F" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- default, not black-translucent: under a translucent bar iOS 26 blurs the top of the
         installed app whatever the page paints there (#1136). iOS reads this tag at install
         only, so an existing home-screen icon keeps the old style until it is added again. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Sowel" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png?v=4" />
    <title>Sowel</title>
    <!-- Decides before first paint whether this load gets the splash (#976) -->
    <script src="/splash.js"></script>
    <style>
      /* Page colours of design-system/tokens.css (--n-50 light and dark, slice 7a)
         and the logo blues: the dark splash draws the house in the dark primary ink. */
      #splash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#ECF2F7;z-index:9999;transition:opacity .4s ease-out}
      .dark #splash{background:#0E191F}
      .dark #splash .splash-ink{stroke:#5BA5CC}
      .dark #splash text.splash-ink{stroke:none;fill:#5BA5CC}
      .no-splash #splash{display:none}
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- Splash screen — first landing or long absence only, see public/splash.js -->
    <div id="splash">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="20 10 160 205" width="180" height="231" fill="none">
        <path class="splash-ink" d="M100 30 L160 90 Q165 95 160 100 L160 150 Q160 158 152 158 L48 158 Q40 158 40 150 L40 100 Q35 95 40 90 Z" fill="none" stroke="#1A4F6E" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>
        <path d="M72 114 Q100 142 128 114" fill="none" stroke="#7FB8D4" stroke-width="7.5" stroke-linecap="round"/>
        <path d="M75 94 Q81 84 87 94" fill="none" stroke="#7FB8D4" stroke-width="7" stroke-linecap="round"/>
        <g transform="translate(119, 89)">
          <animateTransform attributeName="transform" additive="sum" type="scale" values="1 1; 1 1; 1 0.1; 1 1; 1 1" keyTimes="0; 0.35; 0.42; 0.49; 1" dur="1.2s" repeatCount="indefinite"/>
          <path d="M-6 5 Q0 -5 6 5" fill="none" stroke="#7FB8D4" stroke-width="7" stroke-linecap="round"/>
        </g>
        <text class="splash-ink" x="100" y="200" text-anchor="middle" font-family="Nunito,sans-serif" font-weight="700" font-size="40" fill="#1A4F6E" letter-spacing="-0.4">sowel</text>
      </svg>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
