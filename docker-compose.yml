# ============================================================
# Sowel — Production deployment
# Usage: docker compose up -d
# ============================================================

services:
  sowel:
    image: ghcr.io/mchacher/sowel:latest
    container_name: sowel
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Timezone: by default, Sowel auto-derives the timezone from
      # home.latitude/home.longitude configured in the Settings UI.
      # Uncomment to override explicitly (e.g., if you don't set a home location).
      # - TZ=Europe/Paris
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=sowel-auto-token
      - INFLUX_ORG=sowel
      - INFLUX_BUCKET=sowel
    volumes:
      - sowel-data:/app/data
      - sowel-plugins:/app/plugins
      # In-app self-update is opt-in. To enable it, copy
      # docker-compose.override.example.yml to docker-compose.override.yml
      # and run `docker compose up -d`. Read the override file's header
      # for the security trade-off before enabling.
    extra_hosts:
      # Makes the host machine reachable as `host.docker.internal` from
      # inside the Sowel container. Required for MQTT-based plugins
      # (Zigbee2MQTT, LoRa2MQTT, Tasmota, Shelly, Somfy RTS bridge...)
      # to reach a broker running on the host without relying on the
      # host's LAN IP (which can change with DHCP).
      - "host.docker.internal:host-gateway"
    depends_on:
      - influxdb

  influxdb:
    image: influxdb:2.7
    container_name: sowel-influxdb
    restart: unless-stopped
    volumes:
      - influxdb-data:/var/lib/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=sowel
      - DOCKER_INFLUXDB_INIT_PASSWORD=sowel-auto-password
      - DOCKER_INFLUXDB_INIT_ORG=sowel
      - DOCKER_INFLUXDB_INIT_BUCKET=sowel
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=sowel-auto-token

volumes:
  sowel-data:
  sowel-plugins:
  influxdb-data:
