<title>Maison témoin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root {
    --ground: #0e1e2b;
    --panel: rgba(12, 28, 40, 0.74);
    --panel-border: rgba(255, 255, 255, 0.08);
    --fg: #f3f6f8;
    --muted: #a9bcc8;
    --accent: #f2c035;
    --blue: #1a4f6e;
    --blue-light: #6fa3c2;
    --ok: #7fd1a0;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--fg);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 14px;
    overflow: hidden;
  }
  #scene { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; cursor: grab; }
  #scene.dragging { cursor: grabbing; }
  #scene.hover { cursor: pointer; }

  .hud {
    position: fixed;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding: 12px 14px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
  }
  .brand { top: 16px; left: 16px; min-width: 200px; }
  .brand .eyebrow {
    font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted);
    margin: 0 0 4px;
  }
  .brand h1 { font-size: 18px; font-weight: 600; margin: 0 0 8px; text-wrap: balance; }
  .clock {
    font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
    font-size: 28px; font-weight: 500; line-height: 1; font-variant-numeric: tabular-nums;
  }
  .clock small { font-size: 12px; color: var(--muted); margin-left: 8px; font-family: Inter, sans-serif; font-weight: 400; }
  .narrative { margin: 8px 0 0; color: var(--muted); font-size: 13px; max-width: 26ch; line-height: 1.4; }

  .people { top: 16px; right: 16px; min-width: 190px; }
  .people ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .people li { display: flex; align-items: center; gap: 10px; font-size: 13px; }
  .people .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .people .where { color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; }

  .log { bottom: 96px; left: 16px; max-width: 360px; padding: 10px 12px; }
  .log ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  .log li {
    font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-size: 12px; line-height: 1.4;
    color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .log li:last-child { color: var(--fg); }
  .log li .t { color: var(--accent); margin-right: 8px; }
  .log:empty { display: none; }

  .controls {
    bottom: 16px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 14px; padding: 10px 14px;
    max-width: calc(100vw - 32px); box-sizing: border-box;
  }
  .controls button, .seg button {
    font: inherit; color: var(--fg); background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--panel-border); border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  .controls button:hover, .seg button:hover { background: rgba(255, 255, 255, 0.12); }
  .controls button:focus-visible, .seg button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .seg { display: flex; gap: 4px; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #1c1a10; border-color: var(--accent); }
  .controls input[type="range"] { width: 200px; accent-color: var(--accent); }
  .controls label { font-size: 11px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
  .stack { display: grid; gap: 4px; }

  .hint {
    position: fixed; bottom: 72px; left: 50%; transform: translateX(-50%);
    color: var(--muted); font-size: 12px; text-align: center; pointer-events: none;
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.6);
  }
  #fallback { position: fixed; inset: 0; display: none; place-items: center; text-align: center; padding: 24px; color: var(--muted); }

  @media (max-width: 640px) {
    .people { display: none; }
    .log { bottom: 128px; max-width: calc(100vw - 32px); }
    .controls { flex-wrap: wrap; justify-content: center; gap: 10px; }
    .controls input[type="range"] { width: 160px; }
    .hint { display: none; }
  }
</style>

<canvas id="scene" aria-label="Maison témoin en 3D"></canvas>
<div id="fallback">La scène 3D n'a pas pu se charger (bibliothèque Three.js indisponible).</div>

<section class="hud brand">
  <p class="eyebrow">Sowel · démonstrateur</p>
  <h1>Maison témoin</h1>
  <div class="clock"><span id="clock">07:12</span><small id="daylabel">mardi</small></div>
  <p class="narrative" id="narrative">La maison se réveille.</p>
</section>

<section class="hud people" aria-label="Occupants">
  <ul id="people"></ul>
</section>

<section class="hud log" aria-live="polite"><ul id="log"></ul></section>

<p class="hint">Glissez pour tourner · clic droit ou Maj + glisser pour déplacer · molette pour zoomer · cliquez une lampe, une fenêtre ou le sol d'une pièce</p>

<section class="hud controls" aria-label="Simulation">
  <button id="play" aria-label="Pause">❚❚</button>
  <div class="stack">
    <label for="time">Heure</label>
    <input id="time" type="range" min="0" max="24" step="0.02" value="7.2">
  </div>
  <div class="stack">
    <label>Vitesse</label>
    <div class="seg" id="speed">
      <button data-v="30" aria-pressed="false">Lent</button>
      <button data-v="120" aria-pressed="true">Normal</button>
      <button data-v="600" aria-pressed="false">Rapide</button>
    </div>
  </div>
  <div class="stack">
    <label>Météo</label>
    <div class="seg" id="weather">
      <button data-w="clear" aria-pressed="true">Clair</button>
      <button data-w="cloudy" aria-pressed="false">Nuages</button>
      <button data-w="rain" aria-pressed="false">Pluie</button>
    </div>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  if (typeof THREE === "undefined") {
    document.getElementById("fallback").style.display = "grid";
    return;
  }

  // ------------------------------------------------------------
  // Plan de la maison (mètres). x vers l'est, z vers le sud.
  // ------------------------------------------------------------
  const H = 2.6;           // hauteur des murs
  const T = 0.14;          // épaisseur des murs
  const ROOMS = [
    { id: "salon",   name: "Salon",          x: 0,   z: 0, w: 7,   d: 5, floor: 0xc9a06f, spot: [3.2, 3.1], loc: "au salon" },
    { id: "cuisine", name: "Cuisine",        x: 7,   z: 0, w: 5,   d: 5, floor: 0xd8d3ca, spot: [9.4, 3.4], loc: "à la cuisine" },
    { id: "entree",  name: "Entrée",         x: 0,   z: 5, w: 2.4, d: 4, floor: 0xd8d3ca, spot: [1.2, 7.0], loc: "dans l'entrée" },
    { id: "sdb",     name: "Salle de bain",  x: 2.4, z: 5, w: 2.4, d: 4, floor: 0xcfdbe0, spot: [3.6, 6.6], loc: "à la salle de bain" },
    { id: "bureau",  name: "Bureau",         x: 4.8, z: 5, w: 2.4, d: 4, floor: 0xb6bcc6, spot: [6.0, 7.2], loc: "au bureau" },
    { id: "enfant",  name: "Chambre enfant", x: 7.2, z: 5, w: 2.4, d: 4, floor: 0xc9a06f, spot: [8.7, 7.9], loc: "dans la chambre d'enfant" },
    { id: "chambre", name: "Chambre",        x: 9.6, z: 5, w: 2.4, d: 4, floor: 0xc9a06f, spot: [10.2, 8.1], loc: "dans la chambre" },
  ];
  const ROOM = Object.fromEntries(ROOMS.map((r) => [r.id, r]));
  const CENTER = new THREE.Vector3(6, 0, 4.5);

  const win = (at) => ({ at, w: 1.4, sill: 0.9, head: 2.1, kind: "window" });
  const door = (at) => ({ at, w: 0.9, sill: 0, head: 2.1, kind: "door" });
  const WALLS = [
    { axis: "x", at: 0,   from: 0, to: 12, openings: [win(1.6), win(4.6), win(9.5)], outside: true },
    { axis: "x", at: 9,   from: 0, to: 12, openings: [door(1.2), win(3.6), win(6.0), win(8.4), win(10.8)], outside: true },
    { axis: "z", at: 0,   from: 0, to: 9,  openings: [win(2.5)], outside: true },
    { axis: "z", at: 12,  from: 0, to: 9,  openings: [win(2.5), win(7.0)], outside: true },
    { axis: "x", at: 5,   from: 0, to: 12, openings: [door(1.2), door(3.6), door(6.0), door(8.4), door(10.8)] },
    { axis: "z", at: 7,   from: 0, to: 5,  openings: [door(2.5)] },
    { axis: "z", at: 2.4, from: 5, to: 9,  openings: [] },
    { axis: "z", at: 4.8, from: 5, to: 9,  openings: [] },
    { axis: "z", at: 7.2, from: 5, to: 9,  openings: [] },
    { axis: "z", at: 9.6, from: 5, to: 9,  openings: [] },
  ];
  // Portes = arêtes du graphe de circulation
  const DOORS = [
    ["salon", "cuisine", 7, 2.5], ["salon", "entree", 1.2, 5], ["salon", "sdb", 3.6, 5],
    ["salon", "bureau", 6, 5], ["cuisine", "enfant", 8.4, 5], ["cuisine", "chambre", 10.8, 5],
    ["entree", "away", 1.2, 9],
  ];
  const AWAY_SPOT = [1.2, 12.5];

  // ------------------------------------------------------------
  // Rendu
  // ------------------------------------------------------------
  const canvas = document.getElementById("scene");
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x9fd0f0);
  scene.fog = new THREE.Fog(0x9fd0f0, 40, 90);

  const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 200);
  const orbit = { theta: -0.75, phi: 0.98, radius: 20, target: CENTER.clone() };
  function placeCamera() {
    const { theta, phi, radius, target } = orbit;
    camera.position.set(
      target.x + radius * Math.sin(phi) * Math.cos(theta),
      target.y + radius * Math.cos(phi),
      target.z + radius * Math.sin(phi) * Math.sin(theta)
    );
    camera.lookAt(target);
  }

  const sun = new THREE.DirectionalLight(0xffffff, 1.4);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -14; sun.shadow.camera.right = 14;
  sun.shadow.camera.top = 14; sun.shadow.camera.bottom = -14;
  sun.shadow.camera.near = 1; sun.shadow.camera.far = 80;
  sun.shadow.bias = -0.0008;
  sun.shadow.normalBias = 0.02;
  sun.target.position.copy(CENTER);
  scene.add(sun, sun.target);
  const hemi = new THREE.HemisphereLight(0xbfe0f5, 0x6e7e57, 0.55);
  scene.add(hemi);
  const moon = new THREE.DirectionalLight(0x8fa8c8, 0.0);
  moon.position.set(-15, 20, -10);
  scene.add(moon);

  // ------------------------------------------------------------
  // Matériaux et petits constructeurs
  // ------------------------------------------------------------
  const M = {
    wall: new THREE.MeshStandardMaterial({ color: 0xf1ebe0, roughness: 0.92 }),
    slab: new THREE.MeshStandardMaterial({ color: 0xd8d2c7, roughness: 0.95 }),
    grass: new THREE.MeshStandardMaterial({ color: 0x9dbf7f, roughness: 1 }),
    path: new THREE.MeshStandardMaterial({ color: 0xcfc6b6, roughness: 1 }),
    wood: new THREE.MeshStandardMaterial({ color: 0x8a6240, roughness: 0.8 }),
    woodLight: new THREE.MeshStandardMaterial({ color: 0xb98a5e, roughness: 0.8 }),
    fabric: new THREE.MeshStandardMaterial({ color: 0x35627a, roughness: 1 }),
    fabricLight: new THREE.MeshStandardMaterial({ color: 0xe9e2d6, roughness: 1 }),
    white: new THREE.MeshStandardMaterial({ color: 0xf7f7f5, roughness: 0.5 }),
    metal: new THREE.MeshStandardMaterial({ color: 0xb9bec4, roughness: 0.35, metalness: 0.6 }),
    leaf: new THREE.MeshStandardMaterial({ color: 0x5f9a54, roughness: 1 }),
    leafDark: new THREE.MeshStandardMaterial({ color: 0x4a7f45, roughness: 1 }),
    trunk: new THREE.MeshStandardMaterial({ color: 0x6f5238, roughness: 1 }),
    pot: new THREE.MeshStandardMaterial({ color: 0xc46f4e, roughness: 0.9 }),
    amber: new THREE.MeshStandardMaterial({ color: 0xf2c035, roughness: 0.6 }),
    glass: new THREE.MeshStandardMaterial({ color: 0xbfe0f0, roughness: 0.1, metalness: 0.1, transparent: true, opacity: 0.35 }),
    shutter: new THREE.MeshStandardMaterial({ color: 0x7e919c, roughness: 0.7 }),
    door: new THREE.MeshStandardMaterial({ color: 0x2f5f78, roughness: 0.6 }),
    sensor: new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5 }),
  };

  function box(w, h, d, mat, x, y, z, parent, opts) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
    m.position.set(x, y, z);
    m.castShadow = !(opts && opts.noCast);
    m.receiveShadow = true;
    (parent || scene).add(m);
    return m;
  }
  function cyl(rTop, rBot, h, mat, x, y, z, parent, seg) {
    const m = new THREE.Mesh(new THREE.CylinderGeometry(rTop, rBot, h, seg || 20), mat);
    m.position.set(x, y, z);
    m.castShadow = true; m.receiveShadow = true;
    (parent || scene).add(m);
    return m;
  }
  function sphere(r, mat, x, y, z, parent) {
    const m = new THREE.Mesh(new THREE.SphereGeometry(r, 20, 14), mat);
    m.position.set(x, y, z);
    m.castShadow = true; m.receiveShadow = true;
    (parent || scene).add(m);
    return m;
  }

  // ------------------------------------------------------------
  // Terrain
  // ------------------------------------------------------------
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(140, 140), M.grass);
  ground.rotation.x = -Math.PI / 2;
  ground.position.set(6, -0.02, 4.5);
  ground.receiveShadow = true;
  scene.add(ground);
  box(13.2, 0.16, 10.2, M.slab, 6, -0.08, 4.5, scene, { noCast: true }); // dalle
  box(1.6, 0.04, 4.5, M.path, 1.2, 0.0, 11.4, scene, { noCast: true });   // allée
  box(3.2, 0.06, 1.2, M.path, 1.2, 0.0, 9.9, scene, { noCast: true });    // seuil

  function tree(x, z, s) {
    const g = new THREE.Group();
    cyl(0.12 * s, 0.16 * s, 1.2 * s, M.trunk, 0, 0.6 * s, 0, g);
    sphere(0.9 * s, M.leaf, 0, 1.7 * s, 0, g);
    sphere(0.65 * s, M.leafDark, 0.45 * s, 2.2 * s, 0.2 * s, g);
    sphere(0.55 * s, M.leaf, -0.5 * s, 2.1 * s, -0.3 * s, g);
    g.position.set(x, 0, z);
    scene.add(g);
  }
  tree(-3.4, 1.5, 1.3); tree(-2.8, 7.5, 1.0); tree(15.3, 2.5, 1.4); tree(15, 8.8, 1.1);
  tree(4.5, 13.2, 1.0); tree(9.5, 12.6, 1.2); tree(-1.5, -3.2, 1.1); tree(11.5, -3.4, 1.3);
  function bush(x, z, s) {
    sphere(0.4 * s, M.leafDark, x, 0.3 * s, z);
    sphere(0.3 * s, M.leaf, x + 0.3 * s, 0.25 * s, z + 0.1 * s);
  }
  bush(-0.6, 10.2, 1); bush(3.1, 10.3, 1.1); bush(13, 6, 0.9); bush(13.1, -0.6, 1);

  // ------------------------------------------------------------
  // Sols par pièce (cliquables)
  // ------------------------------------------------------------
  const floorMeshes = [];
  for (const r of ROOMS) {
    const mat = new THREE.MeshStandardMaterial({ color: r.floor, roughness: 0.85 });
    const f = new THREE.Mesh(new THREE.PlaneGeometry(r.w, r.d), mat);
    f.rotation.x = -Math.PI / 2;
    f.position.set(r.x + r.w / 2, 0.001, r.z + r.d / 2);
    f.receiveShadow = true;
    f.userData = { type: "floor", room: r.id };
    scene.add(f);
    floorMeshes.push(f);
    // plinthe légère : une ligne plus sombre qui délimite la pièce
  }

  // ------------------------------------------------------------
  // Murs avec ouvertures, vitrages et volets
  // ------------------------------------------------------------
  const shutters = [];   // { mesh, wallIdx, closed, target, manualUntil }
  const windowMeshes = [];
  function wallPiece(w, from, to, y0, y1) {
    if (to - from <= 0.001 || y1 - y0 <= 0.001) return;
    const len = to - from, h = y1 - y0, mid = (from + to) / 2, yc = (y0 + y1) / 2;
    if (w.axis === "x") box(len, h, T, M.wall, mid, yc, w.at);
    else box(T, h, len, M.wall, w.at, yc, mid);
  }
  WALLS.forEach((w, wi) => {
    const ops = [...w.openings].sort((a, b) => a.at - b.at);
    let cursor = w.from;
    for (const o of ops) {
      const a = o.at - o.w / 2, b = o.at + o.w / 2;
      wallPiece(w, cursor, a, 0, H);
      wallPiece(w, a, b, 0, o.sill);
      wallPiece(w, a, b, o.head, H);
      if (o.kind === "window") {
        const gw = o.w, gh = o.head - o.sill, gy = (o.head + o.sill) / 2;
        const glass = new THREE.Mesh(
          w.axis === "x" ? new THREE.BoxGeometry(gw, gh, 0.03) : new THREE.BoxGeometry(0.03, gh, gw), M.glass);
        if (w.axis === "x") glass.position.set(o.at, gy, w.at); else glass.position.set(w.at, gy, o.at);
        glass.userData = { type: "window", idx: shutters.length };
        scene.add(glass);
        windowMeshes.push(glass);
        // cadre
        const frameMat = M.white;
        if (w.axis === "x") {
          box(gw + 0.08, 0.05, T + 0.04, frameMat, o.at, o.sill, w.at);
          box(gw + 0.08, 0.05, T + 0.04, frameMat, o.at, o.head, w.at);
        } else {
          box(T + 0.04, 0.05, gw + 0.08, frameMat, w.at, o.sill, o.at);
          box(T + 0.04, 0.05, gw + 0.08, frameMat, w.at, o.head, o.at);
        }
        // volet : géométrie ancrée en haut, mise à l'échelle en y
        const sg = w.axis === "x" ? new THREE.BoxGeometry(gw - 0.02, gh, 0.05) : new THREE.BoxGeometry(0.05, gh, gw - 0.02);
        sg.translate(0, -gh / 2, 0);
        const sh = new THREE.Mesh(sg, M.shutter);
        const off = w.outside ? (w.axis === "x" ? (w.at === 0 ? -1 : 1) : (w.at === 0 ? -1 : 1)) * (T / 2 + 0.05) : 0;
        if (w.axis === "x") sh.position.set(o.at, o.head, w.at + off); else sh.position.set(w.at + off, o.head, o.at);
        sh.scale.y = 0.001;
        sh.castShadow = true;
        sh.userData = { type: "window", idx: shutters.length };
        scene.add(sh);
        shutters.push({ mesh: sh, closed: false, target: 0, manualUntil: -1 });
        windowMeshes.push(sh);
      } else if (o.kind === "door" && w.outside) {
        const d = box(o.w - 0.04, o.head - 0.02, 0.06, M.door, o.at, (o.head) / 2, w.at + T / 2 + 0.02);
        d.userData = { type: "frontdoor" };
        sphere(0.04, M.amber, o.at + 0.3, 1.05, w.at + T / 2 + 0.07);
      }
      cursor = b;
    }
    wallPiece(w, cursor, w.to, 0, H);
    void wi;
  });

  // ------------------------------------------------------------
  // Mobilier (boîtes et cylindres, style maison de poupée)
  // ------------------------------------------------------------
  function rug(x, z, w, d, color) {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), new THREE.MeshStandardMaterial({ color, roughness: 1 }));
    m.rotation.x = -Math.PI / 2; m.position.set(x, 0.012, z); m.receiveShadow = true; scene.add(m);
  }
  function sofa(x, z, w, facingNorth) {
    const g = new THREE.Group();
    box(w, 0.42, 0.9, M.fabric, 0, 0.21, 0, g);
    box(w, 0.4, 0.25, M.fabric, 0, 0.6, facingNorth ? 0.33 : -0.33, g);
    box(0.22, 0.25, 0.9, M.fabric, -w / 2 + 0.11, 0.53, 0, g);
    box(0.22, 0.25, 0.9, M.fabric, w / 2 - 0.11, 0.53, 0, g);
    box(w - 0.5, 0.12, 0.55, M.fabricLight, 0, 0.47, facingNorth ? -0.1 : 0.1, g);
    g.position.set(x, 0, z); scene.add(g);
  }
  function table(x, z, w, d, h) {
    box(w, 0.05, d, M.woodLight, x, h, z);
    for (const [sx, sz] of [[-1, -1], [1, -1], [-1, 1], [1, 1]])
      box(0.06, h, 0.06, M.wood, x + sx * (w / 2 - 0.08), h / 2, z + sz * (d / 2 - 0.08));
  }
  function chair(x, z, rot) {
    const g = new THREE.Group();
    box(0.42, 0.05, 0.42, M.woodLight, 0, 0.45, 0, g);
    box(0.42, 0.45, 0.05, M.woodLight, 0, 0.68, -0.19, g);
    for (const [sx, sz] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) box(0.04, 0.45, 0.04, M.wood, sx * 0.18, 0.22, sz * 0.18, g);
    g.rotation.y = rot; g.position.set(x, 0, z); scene.add(g);
  }
  function bed(x, z, w, d, color) {
    box(w, 0.35, d, M.wood, x, 0.18, z);
    box(w - 0.08, 0.18, d - 0.08, new THREE.MeshStandardMaterial({ color, roughness: 1 }), x, 0.44, z);

  const adj = {};
  for (const [a, b, x, z] of DOORS) {
    (adj[a] = adj[a] || []).push({ to: b, x, z });

  }
  function routeBetween(from, to) {
    if (from === to) return [];
    const prev = { [from]: null }, queue = [from];
    while (queue.length) {
      const cur = queue.shift();
      if (cur === to) break;
      for (const e of adj[cur] || []) if (!(e.to in prev)) { prev[e.to] = { from: cur, e }; queue.push(e.to); }
    }
    if (!(to in prev)) return [];
    const pts = [];
    for (let n = to; prev[n]; n = prev[n].from) pts.unshift(new THREE.Vector3(prev[n].e.x, 0, prev[n].e.z));
    return pts;
  }

  const SKY = {

  const tmpColor = new THREE.Color();
  function skyColor(el, h, weatherLevel) {

      c.copy(SKY.night).lerp(h < 12 ? SKY.dawn : SKY.dusk, t);
    } else {
      const t = Math.min(1, (el - 0.15) / 0.35);
      c.copy(h < 12 ? SKY.dawn : SKY.dusk).lerp(SKY.day, t);
    }
    if (el > -0.1) c.lerp(SKY.overcast, (1 - weatherLevel) * Math.min(1, (el + 0.1) / 0.3));

      if (l.manualUntil > sim.hour) continue;

      if (s.present && dark && !l.on) setLamp(r.id, true, "mouvement, il fait sombre");

  const drag = { active: false, moved: 0, x: 0, y: 0, id: null, pan: false };
  canvas.addEventListener("contextmenu", (e) => e.preventDefault());
  const pointers = new Map();
  let pinchDist = 0;
  canvas.addEventListener("pointerdown", (e) => {
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 1) {
      drag.active = true; drag.moved = 0; drag.x = e.clientX; drag.y = e.clientY;
      drag.pan = e.button === 2 || e.button === 1 || e.shiftKey;
      canvas.classList.add("dragging");
    }
    if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinchDist = Math.hypot(a.x - b.x, a.y - b.y); }
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener("pointermove", (e) => {
    if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      if (pinchDist) orbit.radius = THREE.MathUtils.clamp(orbit.radius * (pinchDist / d), 9, 40);
      pinchDist = d; drag.moved = 99; return;
    }
    if (!drag.active) { hover(e); return; }
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    drag.x = e.clientX; drag.y = e.clientY; drag.moved += Math.abs(dx) + Math.abs(dy);
    if (drag.moved > 3) autoRotate = false;
    if (drag.pan) {
      // déplacer la cible dans le plan du sol, relativement à la caméra
      const k = orbit.radius * 0.0012;
      const fx = Math.cos(orbit.theta), fz = Math.sin(orbit.theta);   // direction caméra -> cible (au sol)
      orbit.target.x += (-dx * fz + dy * fx) * k * -1;
      orbit.target.z += (dx * fx + dy * fz) * k * -1;
      orbit.target.x = THREE.MathUtils.clamp(orbit.target.x, -8, 20);
      orbit.target.z = THREE.MathUtils.clamp(orbit.target.z, -8, 18);
      return;
    }
    orbit.theta -= dx * 0.005;
    orbit.phi = THREE.MathUtils.clamp(orbit.phi - dy * 0.005, 0.35, 1.35);
  });
  function endDrag(e) {
    pointers.delete(e.pointerId);
    if (pointers.size === 0) {
      canvas.classList.remove("dragging");

      drag.active = false;
    }
  }

  const ray = new THREE.Raycaster();

  function pick(e) {
    const rect = canvas.getBoundingClientRect();

  // ------------------------------------------------------------

  const clock = new THREE.Clock();

  function resize() {

  function frame() {
    const dt = Math.min(clock.getDelta(), 0.1);

    // temps simulé
    if (sim.running) {
      sim.hour += (dt * sim.speed) / 3600;
      if (sim.hour >= 24) {
        sim.hour -= 24; sim.day = (sim.day + 1) % 7;
        for (const id in lamps) { lamps[id].manualUntil -= 24; lamps[id].lastPresence -= 24; }
        for (const s of shutters) s.manualUntil -= 24;
        for (const p of people) if (p.pinnedUntil) p.pinnedUntil -= 24;
      }
      timeEl.value = sim.hour.toFixed(2);
    }
    if (autoRotate) orbit.theta += dt * 0.04;
    placeCamera();

    // météo
    sim.weatherTarget = sim.weather === "clear" ? 1 : sim.weather === "cloudy" ? 0.35 : 0.2;
    sim.weatherLevel += (sim.weatherTarget - sim.weatherLevel) * Math.min(1, dt * 1.5);
    sim.rainLevel += ((sim.weather === "rain" ? 1 : 0) - sim.rainLevel) * Math.min(1, dt * 1.5);

    // soleil et ciel
    const { el, az } = sunState(sim.hour);
    const sunUp = Math.max(0, el);
    const cosEl = Math.sqrt(Math.max(0, 1 - el * el));
    sun.position.set(CENTER.x + Math.cos(az) * 30 * cosEl, CENTER.y + Math.max(el, 0.04) * 30, CENTER.z + Math.sin(az) * 30 * cosEl * 0.6);
    sun.intensity = Math.min(1, sunUp * 2.2) * (0.35 + 0.65 * sim.weatherLevel) * 1.5;
    sun.color.setHSL(0.09, 0.6, 0.5 + 0.5 * Math.min(1, sunUp * 3));
    hemi.intensity = 0.12 + Math.min(1, sunUp * 2.5) * 0.5 * (0.6 + 0.4 * sim.weatherLevel);
    moon.intensity = el < 0 ? Math.min(0.18, -el * 0.5) : 0;
    const sky = skyColor(el, sim.hour, sim.weatherLevel);
    scene.background.copy(sky);
    scene.fog.color.copy(sky);
    hemi.color.copy(sky).lerp(new THREE.Color(0xffffff), 0.3);
    renderer.toneMappingExposure = 0.9 + 0.25 * Math.min(1, sunUp * 2);
    const dark = el < 0.12 || (sim.weather === "rain" && el < 0.3);

    // pluie
    rainMat.opacity = sim.rainLevel * 0.7;
    if (sim.rainLevel > 0.01) {
      const arr = rainGeo.attributes.position.array;
      for (let i = 0; i < RAIN_N; i++) {
        arr[i * 3 + 1] -= dt * 9;
        if (arr[i * 3 + 1] < 0) arr[i * 3 + 1] = 14;
      }
      rainGeo.attributes.position.needsUpdate = true;
    }

    // occupants : agenda, déplacements
    for (const p of people) {
      const want = p.pinnedUntil > sim.hour ? p.target : scheduledRoom(p, sim.hour);
      if (want !== p.target && (p.pinnedUntil || -1) <= sim.hour) {
        sendTo(p, want);
      }
      if (p.path.length) {
        const next = p.path[0];
        const dir = next.clone().sub(p.pos);
        const dist = dir.length();
        const stepLen = dt * (1.6 + Math.min(4, sim.speed / 120));
        if (dist <= stepLen) { p.pos.copy(next); p.path.shift(); }
        else { p.pos.add(dir.multiplyScalar(stepLen / dist)); }
        p.mesh.rotation.y = Math.atan2(dir.x, dir.z);
        p.mesh.position.copy(p.pos);
        p.mesh.position.y = Math.abs(Math.sin(performance.now() / 120)) * 0.03;
      }
      const wasRoom = p.room;
      p.room = p.path.length ? roomAtPoint(p.pos.x, p.pos.z) : p.target;
      if (p.room === "away" && wasRoom !== "away") log(`${p.name} quitte la maison`);
      if (wasRoom === "away" && p.room !== "away") log(`${p.name} rentre à la maison`);
      const targetOpacity = p.room === "away" && !p.path.length ? 0 : 1;
      p.opacity += (targetOpacity - p.opacity) * Math.min(1, dt * 3);
      p.mesh.visible = p.opacity > 0.03;
      p.mesh.traverse((m) => { if (m.material) { m.material.transparent = true; m.material.opacity = p.opacity; } });
    }

    // présence par pièce -> détecteurs
    for (const r of ROOMS) {
      const s = sensors[r.id];
      s.present = people.some((p) => p.room === r.id);
      const target = s.present ? 1 : 0;
      s.level += (target - s.level) * Math.min(1, dt * 6);
      s.ledMat.emissiveIntensity = s.level * (0.6 + 0.4 * Math.sin(performance.now() / 150));
    }
    tickAutomation(dark);

    // lampes : fondu
    for (const r of ROOMS) {
      const l = lamps[r.id];
      l.level += ((l.on ? 1 : 0) - l.level) * Math.min(1, dt * 5);
      l.shadeMat.emissiveIntensity = l.level * 0.9;
      l.bulbMat.emissiveIntensity = l.level * 2.5;
      l.light.intensity = l.level * (dark ? 2.4 : 0.7);
    }
    // volets : glissement
    for (const s of shutters) {
      const t = s.closed ? 1 : 0.001;
      s.mesh.scale.y += (t - s.mesh.scale.y) * Math.min(1, dt * 2.5);
    }

    // HUD (10 fois par seconde)
    hudTick += dt;
    if (hudTick > 0.1) {
      hudTick = 0;
      clockEl.textContent = fmt(sim.hour);
      dayEl.textContent = DAYS[sim.day];
      narrativeEl.textContent = narrative(dark);
      peopleEl.innerHTML = people.map((p) => {
        const where = p.room === "away" ? "dehors" : ROOM[p.room].name;
        return `<li><span class="dot" style="background:#${p.color.toString(16).padStart(6, "0")}"></span>${p.name}<span class="where">${where}</span></li>`;
      }).join("");
    }

    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  log("Maison témoin prête. Cliquez une lampe, une fenêtre ou une pièce.");
  frame();
})();
</script>
