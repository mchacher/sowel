site_name: Sowel Documentation
site_url: https://docs.sowel.org
site_description: Documentation for Sowel — Open-source home automation engine
site_author: Marc Chachereau
repo_url: https://github.com/mchacher/sowel
repo_name: mchacher/sowel
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.tabs
    - navigation.tabs.sticky
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/landing.js

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

exclude_docs: |
  audit/

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: fr
          name: Français
          build: true
          nav_translations:
            Home: Accueil
            Technical Guide: Guide technique
            Architecture: Architecture
            Deployment: Déploiement
            API Reference: Référence API
            Plugin Development: Développement de plugins
            Recipe Development: Développement de recettes
            Data Model: Modèle de données
            Contributing: Contribuer
            Specs Index: Index des specs
            User Guide: Guide utilisateur
            Getting Started: Premiers pas
            Devices: Devices
            Equipments: Équipements
            Dashboard: Tableau de bord
            Zones & Rooms: Zones et pièces
            Modes & Calendar: Modes et calendrier
            Recipes: Recettes
            Plugins: Plugins
            Energy Monitoring: Suivi énergétique
            Remote Access: Accès distant
            Release Notes: Notes de version

nav:
  - Home: index.md
  - Technical Guide:
    - technical/index.md
    - Architecture: technical/architecture.md
    - Deployment: technical/deployment.md
    - API Reference: technical/api-reference.md
    - Plugin Development: technical/plugin-development.md
    - Recipe Development: technical/recipe-development.md
    - Data Model:
      - technical/data-model.md
      - Devices: technical/data-model/devices.md
      - Equipments: technical/data-model/equipments.md
      - Zones: technical/data-model/zones.md
      - Modes: technical/data-model/modes.md
      - Recipes: technical/data-model/recipes.md
    - Contributing: technical/contributing.md
    - Specs Index: specs-index.md
  - User Guide:
    - user/index.md
    - Preparing the Host: user/host-setup.md
    - Getting Started: user/getting-started.md
    - Devices: user/devices.md
    - Equipments: user/equipments.md
    - Dashboard: user/dashboard.md
    - Zones & Rooms: user/zones.md
    - Modes & Calendar: user/modes.md
    - Recipes: user/recipes.md
    - Plugins: user/plugins.md
    - Energy Monitoring: user/energy.md
    - Remote Access: user/remote-access.md
    - Release Notes: release-notes.md

extra:
  alternate:
    - name: English
      link: /
      lang: en
    - name: Français
      link: /fr/
      lang: fr
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mchacher/sowel
  generator: false
