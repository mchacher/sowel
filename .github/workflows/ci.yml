name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Supersede a PR's in-flight run when a fixup lands, so the run that matters
# starts immediately instead of queueing behind one nobody is waiting for.
# Pushes to main are never cancelled: a half-run on main tells you nothing.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: CI only reads the repo. No job here writes to the repo,
# publishes packages, or posts statuses, so the default token needs no more.
permissions:
  contents: read

jobs:
  # NOTE: the `name:` of this job and of `frontend` are the check names the
  # `main-protection` ruleset requires. Renaming either one silently stops it
  # from gating merges. Change the ruleset first if you ever need to.
  backend:
    name: Backend (lint, typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          # Explicit, and only the root lockfile: this job installs root deps
          # and nothing else. Left implicit it still keyed on the root
          # lockfile while the job also installed ui deps, so a ui-only
          # lockfile change restored a cache missing those tarballs and never
          # re-saved it.
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Test files are excluded from `typecheck` (tsconfig.json's `exclude`),
      # which let a test assert on a type that does not exist while CI stayed
      # green: roles the engine never had, an event type removed from
      # EngineEvent, string literals outside their union (#834). Blocking from
      # the start, because it is at zero and the point is to keep it there.
      - run: npm run typecheck:tests
      - run: npm run format:check
      - run: npm test

  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: cd ui && npm ci
      - run: cd ui && npm run lint
      # The UI suite (component-test tier, issue #458) runs from ui/ and used
      # to sit in the backend job, which meant installing ui deps twice and
      # putting ~30s on the critical path of the slowest job. It belongs where
      # the ui deps already are. The job's check name is deliberately left
      # unchanged; see the note above.
      - run: cd ui && npm test
      - run: cd ui && npm run build

  specs:
    name: Specs completeness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need main's history for the merge-base diff
      - name: Every new spec folder has spec.md + architecture.md + plan.md
        run: bash scripts/check-specs-complete.sh

  docs-currency:
    name: Documentation currency
    runs-on: ubuntu-latest
    # Spec 167 — the only documentation artefact with a gate (release notes,
    # spec 108) is the only one that never drifted. These two generalise it to
    # the rest of docs/, at the moment the author still has the context: in the
    # PR, not at the tag where sixteen commits have to be reconstructed.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need main's history for the merge-base diff
      - name: EN/FR pages move together
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash scripts/check-docs-parity.sh
      - name: A feat/fix states its documentation impact
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash scripts/check-docs-impact.sh
