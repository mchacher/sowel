name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      test_tag:
        description: "Tag suffix for test images (e.g. ci-test). Pushes :<test_tag> and :<test_tag>-arm64. Does NOT touch :latest."
        required: false
        default: "ci-test"
      restore_latest_from:
        description: "If set (e.g. 1.5.9), the workflow skips builds and only repoints :latest to :<this version>."
        required: false
        default: ""

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Restore :latest tag (manual recovery only) ───────────
  # Triggered only via workflow_dispatch with restore_latest_from set.
  # Useful if a test run accidentally overwrote :latest.
  restore-latest:
    if: github.event_name == 'workflow_dispatch' && inputs.restore_latest_from != ''
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Repoint :latest to :${{ inputs.restore_latest_from }}
        env:
          REPO: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          FROM: ${{ inputs.restore_latest_from }}
        run: |
          docker buildx imagetools create --tag ${REPO}:latest ${REPO}:${FROM}

  # ── Verify release-notes entry exists (spec 108) ─────────
  # Greps both EN and FR release-notes pages for the version anchor that
  # the in-app UpdatesSheet (spec 107) links to. Skipped on workflow_dispatch
  # because the test_tag / restore_latest_from paths do not publish a new
  # public version. On tag push, downstream jobs (ci → docker → release)
  # depend on this job, so a missing entry fails the workflow BEFORE any
  # Docker layer is built or a GitHub release is created.
  verify-release-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check release-notes entry
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "Skipping release-notes check on workflow_dispatch event"
            exit 0
          fi
          VERSION="${GITHUB_REF#refs/tags/v}"
          ANCHOR="v$(echo "$VERSION" | tr . -)"
          missing=0
          for f in docs/release-notes.md docs/release-notes.fr.md; do
            if ! grep -qF "{ #${ANCHOR} }" "$f"; then
              echo "::error file=$f::Missing release-notes entry for v$VERSION (expected anchor: { #${ANCHOR} })"
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            echo "Add a '### v$VERSION — YYYY-MM-DD { #${ANCHOR} }' block under the matching minor section in both EN and FR files, then re-tag (git tag -f v$VERSION && git push --force origin v$VERSION)."
            exit 1
          fi
          echo "Release notes present for v$VERSION ✓"
      - name: Specs index is complete (spec 167)
        run: bash scripts/check-specs-index.sh

  # ── CI checks ─────────────────────────────────────────────
  ci:
    if: github.event_name != 'workflow_dispatch' || inputs.restore_latest_from == ''
    needs: verify-release-notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src/ --ext .ts

      - name: Tests
        run: npx vitest run

      - name: UI checks
        run: |
          cd ui && npm ci
          npm run lint
          npx tsc -b --noEmit
          npm run test

  # ── Docker build + push (amd64, priority) ────────────────
  docker:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          TEST_TAG: ${{ inputs.test_tag }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "version=${TEST_TAG}" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
          fi

      # :latest is deliberately NOT pushed here (#764). This job produces an
      # amd64-only manifest, so pushing :latest before promote-manifest merges
      # the two architectures leaves a window, short but real on every healthy
      # release, in which an arm64 host pulling :latest gets no matching
      # manifest. promote-manifest points :latest at the merged :V instead.
      - name: Compute image tags
        id: tags
        env:
          REPO: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          V: ${{ steps.version.outputs.version }}
        run: |
          {
            echo 'list<<EOF'
            echo "${REPO}:${V}"
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Build and push (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,scope=amd64,mode=max

  # ── Docker build (arm64, native runner, parallel with amd64) ────
  # Runs on a native arm64 GitHub-hosted runner (free for public repos).
  # No QEMU emulation — build time drops from ~12 min to ~2 min and runs
  # in parallel with the amd64 job. Once both archs are pushed, the
  # multi-arch manifest is promoted in this job's last step.
  # continue-on-error keeps an arm64 failure from failing the workflow, but
  # it does not make the release proceed without arm64: promote-manifest and
  # the GitHub Release job are both gated on this job succeeding (#764). An
  # arm64 failure therefore leaves :V pushed as amd64-only and withholds both
  # :latest and the Release, so no instance is told about a version half the
  # fleet cannot pull. Re-running the workflow on the same tag completes it.
  docker-arm64:
    needs: ci
    runs-on: ubuntu-24.04-arm
    permissions:
      packages: write
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          TEST_TAG: ${{ inputs.test_tag }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "version=${TEST_TAG}" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
          fi

      - name: Compute image tags
        id: tags
        env:
          REPO: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          V: ${{ steps.version.outputs.version }}
          IS_RELEASE: ${{ steps.version.outputs.is_release }}
        run: |
          tags="${REPO}:${V}-arm64"
          if [[ "$IS_RELEASE" == "true" ]]; then
            tags="${tags}"$'\n'"${REPO}:latest-arm64"
          fi
          {
            echo 'list<<EOF'
            echo "$tags"
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Build and push (arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,scope=arm64,mode=max

  # ── Promote tags to multi-arch manifest ────────────────────
  # Waits for BOTH archs to be pushed, then merges :V and :V-arm64 into
  # a single multi-arch :V tag (same for :latest). Done in a dedicated
  # job so the two arch builds can run in parallel without an ordering
  # constraint between them.
  promote-manifest:
    needs: [docker, docker-arm64]
    if: always() && needs.docker.result == 'success' && needs.docker-arm64.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          TEST_TAG: ${{ inputs.test_tag }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "version=${TEST_TAG}" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
          fi
      - name: Promote tags to multi-arch manifest
        env:
          REPO: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          V: ${{ steps.version.outputs.version }}
          IS_RELEASE: ${{ steps.version.outputs.is_release }}
        run: |
          docker buildx imagetools create --tag ${REPO}:${V} ${REPO}:${V} ${REPO}:${V}-arm64
          if [[ "$IS_RELEASE" == "true" ]]; then
            # :V is multi-arch as of the line above, so :latest is a copy of it
            # rather than a second merge of the two per-arch tags. This is the
            # only step that publishes :latest, so the tag is never transiently
            # single-arch (#764).
            docker buildx imagetools create --tag ${REPO}:latest ${REPO}:${V}
          fi

  # ── Create GitHub Release (after multi-arch manifest is published) ──
  # Gated behind promote-manifest so the Release is not visible until the
  # multi-arch manifest exists. UpdateChecker polls the GitHub Release
  # (`/releases/latest` in src/core/version-checker.ts), not the GHCR
  # manifest, so a Release published while :V is still amd64-only tells
  # every Raspberry Pi an update is available and then fails their
  # `docker pull` with no matching manifest.
  #
  # arm64 is continue-on-error, so an arm64 failure skips promote-manifest
  # and must skip this job too (#764). Before that condition was added the
  # release job only checked `docker`, so it published anyway and produced
  # exactly the failure the gate exists to prevent, silently and on a green
  # run. amd64 images remain pullable by tag or digest either way; what an
  # arm64 failure withholds is the update announcement.
  release:
    needs: [docker, docker-arm64, promote-manifest]
    if: always() && needs.docker.result == 'success' && needs.promote-manifest.result == 'success' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ github.ref_name }}
        run: |
          gh release create "$V" \
            --title "Sowel ${V#v}" \
            --generate-notes

  # ── GHCR retention policy ─────────────────────────────────
  # After a successful release, prune old container versions on GHCR so
  # storage doesn't grow unbounded across patches. Keeps the N newest
  # versions (by creation date) and never touches the :latest /
  # :latest-arm64 floating tags. Each release adds ~6 manifests
  # (multi-arch index + amd64 + arm64 + attestations + SBOM), so the
  # default 30 covers roughly the last 5 releases — plenty for rollback.
  prune-ghcr:
    needs: [release]
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/delete-package-versions@v5
        with:
          package-name: sowel
          package-type: container
          owner: mchacher
          min-versions-to-keep: 30
          ignore-versions: '^(latest|latest-arm64)$'
