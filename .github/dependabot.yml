version: 2

# Grouping strategy
# -----------------
# Two groups per npm ecosystem, on purpose.
#
# `*-minor-patch` collects ordinary library bumps. Linters, formatters and the
# TypeScript compiler are kept OUT of it: a bump to any of them can fail CI on
# UNCHANGED code (a new lint rule, a reformat, a stricter type check), and
# inside the library group that failure would block every unrelated update.
#
# `*-toolchain` then collects those same tools into one PR of their own, minor
# and patch only. Excluding them from the library group was right; letting them
# arrive one PR per package was not. Enabling Dependabot produced six separate
# eslint-ecosystem PRs that could not even install individually, because the
# packages peer-lock to each other (#797). One toolchain PR per week fixes the
# noise without slowing anything down.
#
# Majors stay individual, for both kinds. A blocked major inside a group blocks
# the group: typescript 7 has been unlandable for months (typescript-eslint
# peers on <6.1.0, and 7.0 ships no programmatic compiler API), and it must not
# be able to hold the rest of the toolchain hostage.
#
# `*-vitest` is the exception to that rule, and exists because "majors stay
# individual" is wrong for packages that peer-lock to an exact version.
# `@vitest/coverage-v8@5.0.0` declares `peer vitest@"5.0.0"` — not a range, the
# exact version — so vitest 5 split across two PRs (#947, #948) gave two runs
# that each failed `npm ci` with ERESOLVE, neither landable alone and neither
# telling you that the other was the missing half. Same failure as the six
# eslint PRs of #797, one layer up: there it was minors, here it is the major
# the individual-major rule deliberately ungrouped. A version-locked family
# travels in one PR whatever the update type, so this group sets no
# `update-types` at all.
#
# It is declared first because a dependency joins the FIRST group it matches,
# and the members are also excluded from `*-minor-patch` below: either alone
# would do, and stating both means a reordering cannot quietly split the family
# back apart. `/ui` carries no `@vitest/*` package today, so its group holds
# one member and changes nothing until it does — the two ecosystems are kept
# symmetrical on purpose, so that adding `@vitest/coverage-v8` to the UI suite
# is a one-line change and not a rediscovery of this bug.
#
# The schedule stays weekly. The current backlog is the one-off catch-up from
# turning Dependabot on, not the steady-state rate, and stretching the interval
# would slow security patches to fix a problem grouping solves better.

updates:
  # Backend npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      backend-vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      backend-minor-patch:
        exclude-patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "typescript-eslint"
          - "@typescript-eslint/*"
          - "prettier"
          - "typescript"
          - "vitest"
          - "@vitest/*"
        update-types:
          - "minor"
          - "patch"
      backend-toolchain:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "typescript-eslint"
          - "@typescript-eslint/*"
          - "prettier"
          - "typescript"
        update-types:
          - "minor"
          - "patch"

  # Frontend npm dependencies
  - package-ecosystem: "npm"
    directory: "/ui"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      ui-vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      ui-minor-patch:
        exclude-patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "typescript-eslint"
          - "@typescript-eslint/*"
          - "prettier"
          - "typescript"
          - "vitest"
          - "@vitest/*"
        update-types:
          - "minor"
          - "patch"
      ui-toolchain:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "typescript-eslint"
          - "@typescript-eslint/*"
          - "prettier"
          - "typescript"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used in workflows, grouped into one PR to cut noise
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    groups:
      github-actions:
        patterns:
          - "*"
